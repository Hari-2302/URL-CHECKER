<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420">
  <style>
    text { font-family: monospace; font-size: 12px; fill: #334155; }
    .state { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.5; }
    .accept { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
    .dead { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .start { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
    .arrow { fill: none; stroke: #334155; stroke-width: 1.5; marker-end: url(#ah); }
    .lbl { font-size: 10px; fill: #2563eb; }
  </style>
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#334155"/>
    </marker>
  </defs>
  <text x="460" y="25" text-anchor="middle" font-size="13" fill="#1a3a5c" font-weight="bold">URL Safety Checker - DFA State Transition Diagram</text>
  <text x="460" y="42" text-anchor="middle" font-size="10" fill="#64748b">Accepting states: q10, q11  |  Any invalid input leads to qDEAD</text>
  <!-- States -->
  <circle cx="45" cy="180" r="22" class="start"/>
  <text x="45" y="176" text-anchor="middle" font-size="11">q0</text>
  <text x="45" y="188" text-anchor="middle" font-size="8">Start</text>
  <circle cx="115" cy="180" r="20" class="state"/>
  <text x="115" y="184" text-anchor="middle" font-size="11">q1</text>
  <circle cx="180" cy="180" r="20" class="state"/>
  <text x="180" y="184" text-anchor="middle" font-size="11">q2</text>
  <circle cx="245" cy="180" r="20" class="state"/>
  <text x="245" y="184" text-anchor="middle" font-size="11">q3</text>
  <circle cx="315" cy="150" r="20" class="state"/>
  <text x="315" y="154" text-anchor="middle" font-size="11">q4</text>
  <circle cx="315" cy="210" r="20" class="state"/>
  <text x="315" y="214" text-anchor="middle" font-size="11">q4s</text>
  <circle cx="390" cy="180" r="20" class="state"/>
  <text x="390" y="184" text-anchor="middle" font-size="11">q5</text>
  <circle cx="455" cy="180" r="20" class="state"/>
  <text x="455" y="184" text-anchor="middle" font-size="11">q6</text>
  <circle cx="520" cy="180" r="20" class="state"/>
  <text x="520" y="184" text-anchor="middle" font-size="11">q7</text>
  <circle cx="590" cy="180" r="20" class="state"/>
  <text x="590" y="184" text-anchor="middle" font-size="11">q8</text>
  <circle cx="660" cy="180" r="20" class="state"/>
  <text x="660" y="184" text-anchor="middle" font-size="11">q9</text>
  <circle cx="730" cy="180" r="22" class="accept"/>
  <circle cx="730" cy="180" r="18" class="accept"/>
  <text x="730" y="176" text-anchor="middle" font-size="11">q10</text>
  <text x="730" y="188" text-anchor="middle" font-size="8">Accept</text>
  <circle cx="810" cy="180" r="22" class="accept"/>
  <circle cx="810" cy="180" r="18" class="accept"/>
  <text x="810" y="176" text-anchor="middle" font-size="11">q11</text>
  <text x="810" y="188" text-anchor="middle" font-size="8">Accept</text>
  <circle cx="490" cy="340" r="25" class="dead"/>
  <text x="490" y="336" text-anchor="middle" font-size="11">qDEAD</text>
  <text x="490" y="348" text-anchor="middle" font-size="8">Reject</text>
  <!-- Arrows -->
  <line x1="67" y1="180" x2="92" y2="180" class="arrow"/>
  <text x="74" y="174" class="lbl">h</text>
  <line x1="135" y1="180" x2="157" y2="180" class="arrow"/>
  <text x="140" y="174" class="lbl">t</text>
  <line x1="200" y1="180" x2="222" y2="180" class="arrow"/>
  <text x="205" y="174" class="lbl">t</text>
  <line x1="265" y1="170" x2="295" y2="157" class="arrow"/>
  <text x="271" y="160" class="lbl">p</text>
  <line x1="265" y1="190" x2="295" y2="203" class="arrow"/>
  <text x="265" y="204" class="lbl">ps</text>
  <line x1="335" y1="158" x2="370" y2="172" class="arrow"/>
  <text x="344" y="158" class="lbl">:</text>
  <line x1="335" y1="202" x2="370" y2="188" class="arrow"/>
  <text x="338" y="204" class="lbl">:</text>
  <line x1="410" y1="180" x2="432" y2="180" class="arrow"/>
  <text x="416" y="174" class="lbl">/</text>
  <line x1="475" y1="180" x2="497" y2="180" class="arrow"/>
  <text x="481" y="174" class="lbl">/</text>
  <line x1="540" y1="180" x2="567" y2="180" class="arrow"/>
  <text x="547" y="174" class="lbl">a-z</text>
  <line x1="610" y1="180" x2="637" y2="180" class="arrow"/>
  <text x="616" y="174" class="lbl">.</text>
  <line x1="680" y1="180" x2="705" y2="180" class="arrow"/>
  <text x="684" y="174" class="lbl">a-z</text>
  <line x1="752" y1="180" x2="785" y2="180" class="arrow"/>
  <text x="757" y="174" class="lbl">/</text>
  <!-- Self loops -->
  <path d="M 600 160 Q 600 130 590 128 Q 580 130 580 160" class="arrow" fill="none"/>
  <text x="590" y="122" text-anchor="middle" class="lbl">a-z,0-9,-</text>
  <path d="M 740 158 Q 740 128 730 126 Q 720 128 720 158" class="arrow" fill="none"/>
  <text x="730" y="120" text-anchor="middle" class="lbl">a-z,0-9</text>
  <path d="M 822 158 Q 826 128 810 126 Q 794 128 798 158" class="arrow" fill="none"/>
  <text x="810" y="120" text-anchor="middle" class="lbl">any</text>
  <!-- Dead state arrows from q8 -->
  <line x1="590" y1="200" x2="510" y2="318" class="arrow"/>
  <text x="537" y="275" class="lbl">@,other</text>
</svg>
